description: >
  Container mount-points rule should skip /sys and /proc (built-in excluded)
  but still warn about /etc/missing (not in mount-points.yaml and not excluded).
module: module
expect:
  - linter: container
    rule: mount-points
    level: warn
    textContains: 'mountPath "/etc/missing" is not declared'
    count: 1
# The built-in-excluded paths mounted alongside /etc/missing must NOT be flagged —
# this is what distinguishes the "mixed" case from mount-points-missing.
expectAbsent:
  - linter: container
    rule: mount-points
    textContains: 'mountPath "/sys"'
  - linter: container
    rule: mount-points
    textContains: 'mountPath "/proc"'
