description: >
  An Ingress with an unsafe configuration-snippet and no HSTS protection must
  produce a migration error and an HSTS error.
module: module
expect:
  - linter: templates
    rule: ingress-rules
    level: error
    textContains: "is unsafe and requires manual migration"
  - linter: templates
    rule: ingress-rules
    level: error
    textContains: "to preserve HSTS"
