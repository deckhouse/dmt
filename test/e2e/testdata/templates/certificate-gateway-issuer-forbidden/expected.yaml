description: >
  A Certificate that pins issuerRef.name to printf "letsencrypt-gateway-%s"
  must be flagged by the certificate-gateway-issuer rule, even when a Helm
  conditional keeps it from being rendered.
module: module
expect:
  - linter: templates
    rule: certificate-gateway-issuer
    level: error
    textContains: "issuerRef.name is pinned to the letsencrypt ClusterIssuer"
