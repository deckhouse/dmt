description: >
  http and www links to deckhouse.io/deckhouse.ru and bare hosts are flagged;
  other hosts that only start with deckhouse.io or deckhouse.ru, and the host
  written without a scheme, are not.
module: module
expect:
  - linter: templates
    rule: documentation-links
    count: 3
  - linter: templates
    rule: documentation-links
    count: 1
    textContains: '"http://deckhouse.ru/modules/e2e/"'
  - linter: templates
    rule: documentation-links
    count: 1
    textContains: '"https://www.deckhouse.io/modules/e2e/"'
  - linter: templates
    rule: documentation-links
    count: 1
    textContains: '"https://deckhouse.io"'
