apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: e2e-monitor-source-label-labeled
  namespace: d8-monitoring
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: e2e
  podMetricsEndpoints:
  - port: https-metrics
    relabelings:
    - targetLabel: tier
      replacement: cluster
    - targetLabel: d8_source
      replacement: dkp
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: e2e-monitor-source-label-labeled
  namespace: d8-monitoring
spec:
  groups:
  - name: e2e.monitor-source-label-labeled
    rules:
    - record: e2e:up:sum
      expr: sum(up)
      labels:
        d8_source: dkp
