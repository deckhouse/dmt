description: >
  A module whose .dmtlint.yaml excludes monitoring/prometheus-rules/alerts.yaml
  from the documentation-links rule via exclude-rules.documentation-links.files
  must not be flagged for that file, even though it still links to the public
  documentation site. This proves the exclude-rules configuration is wired from
  .dmtlint.yaml through to the rule.
module: module
expectAbsent:
  - linter: templates
    rule: documentation-links
