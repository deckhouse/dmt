{{- if eq (include "e2e-rbac.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: e2e-rbac
    rbac.deckhouse.io/aggregate-to-namespace-as: manager
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "namespace-capability.e2e-rbac.edit"
    rbac.deckhouse.io/scope: namespace
  name: d8:namespace-capability:e2e-rbac:edit
  annotations:
    en.meta.deckhouse.io/title: "Module e2e-rbac: edit"
    ru.meta.deckhouse.io/title: "Модуль e2e-rbac: редактирование"
    en.meta.deckhouse.io/description: "Manage e2e-rbac resources in a namespace."
    ru.meta.deckhouse.io/description: "Управление ресурсами модуля e2e-rbac в пространстве имён."
rules:
- apiGroups:
  - e2e.deckhouse.io
  resources:
  - widgets
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: e2e-rbac
    rbac.deckhouse.io/aggregate-to-kubernetes-as: manager
    rbac.deckhouse.io/kind: use
  name: d8:use:capability:module:e2e-rbac:edit
rules:
- apiGroups:
  - e2e.deckhouse.io
  resources:
  - widgets
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
{{- end }}
