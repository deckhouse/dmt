{{- if eq (include "e2e-rbac.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: e2e-rbac
    rbac.deckhouse.io/aggregate-to-security-as: manager
    rbac.deckhouse.io/namespace: d8-e2e-rbac
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.e2e-rbac.edit"
    rbac.deckhouse.io/scope: system
  name: d8:system-capability:e2e-rbac:edit
  annotations:
    en.meta.deckhouse.io/title: "Module e2e-rbac: edit configuration"
    ru.meta.deckhouse.io/title: "Модуль e2e-rbac: управление конфигурацией"
    en.meta.deckhouse.io/description: "Manage the e2e-rbac module configuration."
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля e2e-rbac."
rules:
- apiGroups:
  - e2e.deckhouse.io
  resources:
  - daemons
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - deckhouse.io
  resourceNames:
  - e2e-rbac
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: e2e-rbac
    rbac.deckhouse.io/aggregate-to-security-as: manager
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-e2e-rbac
    rbac.deckhouse.io/kind: manage
  name: d8:manage:permission:module:e2e-rbac:edit
rules:
- apiGroups:
  - e2e.deckhouse.io
  resources:
  - daemons
  verbs:
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - deckhouse.io
  resourceNames:
  - e2e-rbac
  resources:
  - moduleconfigs
  verbs:
  - create
  - update
  - patch
  - delete
{{- end }}
