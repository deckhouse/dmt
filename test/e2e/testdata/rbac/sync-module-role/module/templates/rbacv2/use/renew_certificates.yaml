---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:namespace-capability:cert-manager:renew_certificates
  {{- include "helm_lib_module_labels" (list . (dict "cert-manager.deckhouse.io/aggregate-to-renewer" "true" "rbac.deckhouse.io/aggregate-to-namespace-as" "admin" "rbac.deckhouse.io/capability" "namespace-capability.cert-manager.renew_certificates" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/scope" "namespace")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Renew cert-manager Certificates in a namespace."
    en.meta.deckhouse.io/title: "Module cert-manager: renew certificates"
    ru.meta.deckhouse.io/description: "Перевыпуск Certificate модуля cert-manager в пространстве имён."
    ru.meta.deckhouse.io/title: "Модуль cert-manager: перевыпуск сертификатов"
rules:
- apiGroups:
  - cert-manager.io
  resources:
  - certificates/status
  verbs:
  - patch
  - update
