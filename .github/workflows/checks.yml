name: CI

# Standard CI (go mod, golangci-lint, tests) plus — on PRs / manual dispatch —
# verification that the dmt build from this branch lints the real deckhouse
# codebase and the modules-template reference module without regressions.
#
# Ordering: the DMT verify jobs `needs: [golangci-lint, tests]`, so they only
# start after those pass. They are gated to pull_request / workflow_dispatch
# (not raw branch pushes) so the expensive deckhouse clone+lint stays PR-bound
# and the skip-label bypass stays meaningful.
#
# Bypass: if a DMT verify lint fails but the PR carries the "dmtlint-verify-skip"
# label, that check passes (the failure is acknowledged and merge is allowed).
on:
  push:
    branches-ignore: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
  workflow_dispatch:
    inputs:
      deckhouse_branch:
        description: 'Deckhouse branch or tag to run dmt lint on'
        required: false
        default: 'main'
        type: string
      template_branch:
        description: 'modules-template branch or tag to run dmt lint on'
        required: false
        default: 'main'
        type: string
      matrix:
        description: 'Render and lint all template variants (--matrix)'
        required: false
        default: false
        type: boolean
      matrix_limit:
        description: 'Max value combinations per module (--matrix-limit); empty = default'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  # https://github.com/actions/setup-go#supported-version-syntax
  GO_VERSION: '1.24'
  SKIP_LABEL: dmtlint-verify-skip
  DECKHOUSE_REPO: https://github.com/deckhouse/deckhouse.git
  DECKHOUSE_REF: ${{ inputs.deckhouse_branch || 'main' }}
  TEMPLATE_REPO: https://github.com/deckhouse/modules-template.git
  TEMPLATE_REF: ${{ inputs.template_branch || 'main' }}

jobs:
  # Check if there is any dirty change for go mod tidy
  go-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod
          git diff --exit-code go.sum

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.8.0

  tests:
    needs: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests
        run: make test

  lint-deckhouse:
    name: DMT verify deckhouse
    needs: [ golangci-lint, tests ]
    # Skip on raw branch pushes — deckhouse clone+lint is expensive and the
    # skip-label only makes sense on PRs.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check skip label
        id: skip
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
            && [[ "${{ contains(github.event.pull_request.labels.*.name, env.SKIP_LABEL) }}" == "true" ]]; then
            echo "::warning::'${SKIP_LABEL}' label present — skipping deckhouse lint."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dmt
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Go
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dmt
        if: steps.skip.outputs.skip != 'true'
        run: make build

      - name: Clone deckhouse (${{ env.DECKHOUSE_REF }})
        if: steps.skip.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${DECKHOUSE_REF}" "${DECKHOUSE_REPO}" "${RUNNER_TEMP}/deckhouse-src"

      - name: Prepare /deckhouse
        if: steps.skip.outputs.skip != 'true'
        run: |
          sudo mkdir -p /deckhouse
          sudo chown "$(id -u):$(id -g)" /deckhouse

      - name: Lint deckhouse with built dmt
        if: steps.skip.outputs.skip != 'true'
        env:
          DMT_BIN: ${{ github.workspace }}/dmt
          SRC_DIR: ${{ runner.temp }}/deckhouse-src
          WORK_DIR: /deckhouse
          DMT_MATRIX: ${{ inputs.matrix && 'true' || 'false' }}
          DMT_MATRIX_LIMIT: ${{ inputs.matrix_limit }}
        run: bash .github/scripts/dmt-lint-deckhouse.sh

  lint-modules-template:
    name: DMT verify modules-template
    needs: [ golangci-lint, tests ]
    # Skip on raw branch pushes — see lint-deckhouse above.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check skip label
        id: skip
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]] \
            && [[ "${{ contains(github.event.pull_request.labels.*.name, env.SKIP_LABEL) }}" == "true" ]]; then
            echo "::warning::'${SKIP_LABEL}' label present — skipping modules-template lint."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dmt
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Go
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build dmt
        if: steps.skip.outputs.skip != 'true'
        run: make build

      - name: Clone modules-template (${{ env.TEMPLATE_REF }})
        if: steps.skip.outputs.skip != 'true'
        run: |
          git clone --depth 1 --branch "${TEMPLATE_REF}" "${TEMPLATE_REPO}" "${RUNNER_TEMP}/modules-template"

      - name: Lint modules-template with built dmt
        if: steps.skip.outputs.skip != 'true'
        env:
          DMT_BIN: ${{ github.workspace }}/dmt
          SRC_DIR: ${{ runner.temp }}/modules-template
        run: bash .github/scripts/dmt-lint-modules-template.sh
