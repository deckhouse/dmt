# dmt CI. Ported from GitHub Actions, the same way as deckhouse-cli.
# GitHub is a push mirror of this project (Settings -> Repository -> Mirroring repositories):
# same commits and tags. Releases are not mirrored: release:gitlab and release:github make them.
#
# CI/CD variables (Settings -> CI/CD -> Variables):
#   TRDL_VAULT_ADDR         trdl server (protected, masked)
#   TRDL_VAULT_ROLE_ID      trdl approle (protected, masked)
#   TRDL_VAULT_SECRET_ID    trdl approle (protected, masked)
#   GH_TOKEN                release:github: GitHub token of deckhouse-BOaTswain (protected, masked and hidden)
# Protected variables reach tag pipelines only when the v* tags are protected.
#
# dmt-verify:deckhouse clones deckhouse/deckhouse with CI_JOB_TOKEN. Needs: this project in the
# deckhouse job token allowlist, and read access to deckhouse for whoever runs the pipeline.
#
# Pipeline schedule (Build -> Pipeline schedules): trdl-build-check, "0 7 * * 1" on main.

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/

variables:
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: "2.15.0"
  GORELEASER_VERSION: "2.19.0"
  GH_VERSION: "2.102.0"
  # bash and GNU grep for dmt-lint-deckhouse.sh
  LINT_IMAGE: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
  # The Run pipeline form (Build -> Pipelines -> Run pipeline), as the GitHub workflow_dispatch inputs.
  DECKHOUSE_REF:
    value: main
    description: deckhouse branch or tag for dmt-verify:deckhouse
  TEMPLATE_REF:
    value: main
    description: modules-template branch or tag for dmt-verify:modules-template
  DMT_MATRIX:
    value: "false"
    options: ["false", "true"]
    description: dmt-verify:deckhouse renders and lints all template variants (--matrix)
  DMT_MATRIX_LIMIT:
    value: ""
    description: Max value combinations per module (--matrix-limit); empty = default

# Shell runners, as in deckhouse-cli: no image and no root, so jobs put their tools into .tools.
default:
  tags:
    - deckhouse
  interruptible: true
  hooks:
    # Go unpacks some files read-only; without this git clean cannot remove .tools from an earlier job.
    pre_get_sources_script:
      - chmod -R u+w "$CI_PROJECT_DIR/.tools" 2>/dev/null || true

.checks:
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(merge_request_event|web)$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

.on_release_tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

.go:
  needs: []
  variables:
    GOTOOLCHAIN: local
    GOFLAGS: -modcacherw # so the next checkout can delete the module cache
  before_script:
    - mkdir -p .tools/bin
    - export PATH="$PWD/.tools/bin:$PWD/.tools/go/bin:$PATH" GOPATH="$PWD/.tools/gopath" GOCACHE="$PWD/.tools/gocache"
    - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -xz -C .tools
    - go version

# --- Checks -------------------------------------------------------------------

go-mod:
  extends: [.go, .checks]
  script:
    - go mod tidy
    - git diff --exit-code go.mod go.sum

golangci-lint:
  extends: [.go, .checks]
  script:
    - curl -fsSL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" | tar -xz -C .tools/bin --strip-components=1 "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
    - golangci-lint run

test:
  extends: [.go, .checks]
  needs: [golangci-lint]
  script:
    - make test

# The dmt build from this branch lints the real deckhouse and modules-template without regressions.
.dmt-verify:
  extends: .go
  needs: [golangci-lint, test]
  rules:
    # The dmtlint-verify-skip label acknowledges a failure and allows the merge.
    # Labels do not start pipelines: run a new one after adding it.
    - if: $CI_MERGE_REQUEST_LABELS =~ /(^|,)dmtlint-verify-skip(,|$)/
      allow_failure: true
    - !reference [.checks, rules]

dmt-verify:deckhouse:
  extends: .dmt-verify
  script:
    - CGO_ENABLED=0 make build
    - git clone --depth 1 --branch "$DECKHOUSE_REF" "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/deckhouse/deckhouse.git" .deckhouse-src
    # Deckhouse OpenAPI schemas $ref absolute /deckhouse/... paths. Root in a container
    # can create /deckhouse, the runner user cannot.
    - docker run --rm -v "$PWD:/src:ro" -w /src -e DMT_BIN=/src/dmt -e SRC_DIR=/src/.deckhouse-src -e DMT_MATRIX -e DMT_MATRIX_LIMIT
        "$LINT_IMAGE" bash .gitlab/scripts/dmt-lint-deckhouse.sh

dmt-verify:modules-template:
  extends: .dmt-verify
  script:
    - make build
    - git clone --depth 1 --branch "$TEMPLATE_REF" https://github.com/deckhouse/modules-template.git .modules-template
    - DMT_BIN=./dmt SRC_DIR=.modules-template bash .gitlab/scripts/dmt-lint-modules-template.sh

# Reproduces the trdl server release build (trdl.yaml), so a broken release is caught before a tag
# is pushed. Weekly too: the build fetches gox@latest and Go modules, so it can break without a change here.
trdl-build-check:
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web)$/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - trdl.yaml
        - go.mod
        - go.sum
        - scripts/ci/build_release.sh
        - .gitlab-ci.yml
        - .gitlab/scripts/trdl-build-check.sh
  script:
    - bash .gitlab/scripts/trdl-build-check.sh

# --- Release tags -------------------------------------------------------------

# goreleaser only builds (.goreleaser.yml keeps the asset names); release:gitlab and
# release:github publish, as in deckhouse-cli.
release:build:
  extends: [.go, .on_release_tag]
  stage: build
  interruptible: false
  variables:
    GORELEASER_CURRENT_TAG: $CI_COMMIT_TAG
  script:
    - curl -fsSL "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" | tar -xz -C .tools/bin goreleaser
    - goreleaser release --clean --skip=publish --timeout=90m
  artifacts:
    paths:
      - dist/*.tar.gz
      - dist/*-checksums.txt
    expire_in: 1 week

# A GitLab release only holds links, and job artifacts expire,
# so the files go to the project's generic package registry.
release:gitlab:
  extends: .on_release_tag
  stage: deploy
  needs: ["release:build"]
  interruptible: false
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      if curl -sSf -o /dev/null -H "JOB-TOKEN: $CI_JOB_TOKEN" "$api/releases/$CI_COMMIT_TAG"; then
        echo "GitLab release $CI_COMMIT_TAG already exists"
        exit 0
      fi
      git fetch --tags --quiet origin
      prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${CI_COMMIT_TAG}^" 2>/dev/null || true)"
      changes="$(git log --no-merges --format='* %s' ${prev:+"${prev}.."}"$CI_COMMIT_TAG")"
      links='[]'
      for f in dist/*.tar.gz dist/*-checksums.txt; do
        name="$(basename "$f")"
        url="$api/packages/generic/dmt/$CI_COMMIT_TAG/$name"
        curl -sS --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url"
        links="$(jq -c --arg name "$name" --arg url "$url" '. + [{name: $name, url: $url, link_type: "package"}]' <<<"$links")"
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --arg desc "$changes" --argjson links "$links" \
          '{tag_name: $tag, name: $tag, description: $desc, assets: {links: $links}}' \
        | curl -sS --fail-with-body -H "JOB-TOKEN: $CI_JOB_TOKEN" -H "Content-Type: application/json" \
            --data @- "$api/releases"

# tools/install.sh downloads dmt from here: keep the asset names.
# Runs last, once trdl:release has passed: publishes only what trdl accepted the signature for.
release:github:
  extends: .on_release_tag
  stage: deploy
  needs: ["release:build", "trdl:release"]
  interruptible: false
  variables:
    GIT_DEPTH: "0"
    GH_REPO: deckhouse/dmt
  # GH_TOKEN: project CI/CD variable (protected, masked and hidden)
  before_script:
    - mkdir -p .tools/bin && export PATH="$PWD/.tools/bin:$PATH"
    - curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar -xz -C .tools/bin --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"
  script:
    - |
      # The push mirror brings the tag to GitHub right after it is pushed here.
      for i in $(seq 30); do
        # For an annotated tag, the ^{} line (last) holds its commit.
        sha="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$CI_COMMIT_TAG" "refs/tags/$CI_COMMIT_TAG^{}" | tail -n1 | cut -f1)"
        [ -n "$sha" ] && break
        echo "Waiting for the mirror to push $CI_COMMIT_TAG to GitHub ($i/30)..."
        sleep 60
      done
      [ "$sha" = "$CI_COMMIT_SHA" ] || { echo "GitHub $CI_COMMIT_TAG is at '$sha', expected $CI_COMMIT_SHA: check the mirror" >&2; exit 1; }
    - |
      # Same layout as GitHub's generated notes, without service commits and links to internal MRs.
      git fetch --tags --quiet origin
      prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${CI_COMMIT_TAG}^" 2>/dev/null || true)"
      NOTES="## What's Changed"$'\n'"$(git log --no-merges --format='* %s' ${prev:+"${prev}.."}"$CI_COMMIT_TAG" \
        | grep -v -E '^\* (Signed release channels|bump channel)' | sed -E 's/ \(![0-9]+\)$//')" || true
      if [ -n "$prev" ]; then
        NOTES+=$'\n\n'"**Full Changelog**: https://github.com/$GH_REPO/compare/$prev...$CI_COMMIT_TAG"
      fi
    - |
      # GitHub makes every new release Latest; a patch to an older line must not take it.
      newest="$(git tag -l --sort=v:refname 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | tail -n1)"
      latest=false; [ "$CI_COMMIT_TAG" = "$newest" ] && latest=true
      gh release create "$CI_COMMIT_TAG" --verify-tag --latest="$latest" --title "$CI_COMMIT_TAG" --notes "$NOTES" dist/*.tar.gz dist/*-checksums.txt \
        || gh release upload "$CI_COMMIT_TAG" --clobber dist/*.tar.gz dist/*-checksums.txt

# --- trdl ---------------------------------------------------------------------

.trdl:
  stage: deploy
  needs: []
  interruptible: false
  resource_group: trdl
  timeout: 7h # trdl.sh keeps retrying for up to 6h (needs curl and jq, both on the runner hosts)

trdl:release:
  extends: [.trdl, .on_release_tag]
  script:
    - bash .gitlab/scripts/trdl.sh release "$CI_COMMIT_TAG"

trdl:publish:
  extends: .trdl
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
      changes:
        - trdl_channels.yaml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  script:
    - bash .gitlab/scripts/trdl.sh publish
