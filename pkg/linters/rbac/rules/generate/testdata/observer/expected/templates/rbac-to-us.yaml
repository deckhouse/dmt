---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-observer
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments/prometheus-metrics
  resourceNames:
  - observer
  verbs:
  - get
{{- if .Values.global.enabledModules | has "prometheus" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-observer
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-observer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: d8-monitoring:scraper
- kind: ServiceAccount
  name: prometheus
  namespace: d8-monitoring
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-observer-metrics
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - apps
  resources:
  - daemonsets/prometheus-metrics
  resourceNames:
  - agent
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - statefulsets/prometheus-metrics
  resourceNames:
  - store
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-observer-metrics
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-observer-metrics
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: d8-monitoring:scraper
- kind: ServiceAccount
  name: prometheus
  namespace: d8-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-observer-http
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments/http
  resourceNames:
  - observer
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-observer-http
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-observer-http
subjects:
- kind: ServiceAccount
  name: ingress-nginx
  namespace: d8-ingress-nginx
