---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-dex-prometheus-metrics
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
rules:
- apiGroups:
  - apps
  resources:
  - deployments/prometheus-metrics
  resourceNames:
  - dex
  verbs:
  - get
{{- if (.Values.global.enabledModules | has "prometheus") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-dex-prometheus-metrics
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "dex")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-dex-prometheus-metrics
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: d8-monitoring:scraper
- kind: ServiceAccount
  name: prometheus
  namespace: d8-monitoring
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-dex-configmap-reader
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - dex
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-dex-configmap-reader-binding
  namespace: d8-{{ $.Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-dex-configmap-reader
subjects:
- kind: ServiceAccount
  name: reader
  namespace: d8-{{ $.Chart.Name }}
- kind: ServiceAccount
  name: grafana
  namespace: d8-monitoring
