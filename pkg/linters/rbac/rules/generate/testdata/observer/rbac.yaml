# A module that keeps the names its objects had before the declaration: scrape access in a component
# directory and at the root under a name of its own, beside the access-to-<module> of the first
# declarations; a binding in a namespace of the platform under the name the module gave it.
apiVersion: rbac.deckhouse.io/v1alpha1
serviceAccounts:
  - name: controller
    path: controller
    labels: {app: controller}
    namespaceRules:
      - apiGroups: [coordination.k8s.io]
        resources: [leases]
        verbs: [get, create, update]
    bindRoles:
      # the name the module gave the binding, which the placement rule accepts with an exclusion
      - namespace: d8-log-shipper
        name: d8:observer:controller:log-shipper-secrets
        bindingName: d8:observer:controller:log-shipper-secrets
      # the name the placement rule wants
      - namespace: kube-system
        name: extension-apiserver-authentication-reader
prometheusAccess:
  - deployments: [observer]
    when: .Values.global.enabledModules | has "prometheus"
  - name: metrics
    daemonsets: [agent]
    statefulsets: [store]
  - path: dex
    name: prometheus-metrics
    deployments: [dex]
    labels: {app: dex}
    when: (.Values.global.enabledModules | has "prometheus")
access:
  # a name that already carries the prefix of its file is the object's name as it is
  - name: access-to-observer-http
    subjects:
      - kind: ServiceAccount
        name: ingress-nginx
        namespace: d8-ingress-nginx
    namespaceRules:
      - apiGroups: [apps]
        resources: [deployments/http]
        resourceNames: [observer]
        verbs: [get]
  # the binding keeps the name it had beside its ClusterRole
  - name: accessible-namespaces-reader
    bindingName: d8:observer:accessible-namespaces-reader:system-authenticated
    subjects:
      - kind: Group
        name: system:authenticated
    clusterRules:
      - apiGroups: [""]
        resources: [namespaces]
        verbs: [list]
  - name: reader
    path: dex
    roleName: access-to-dex-configmap-reader
    bindingName: access-to-dex-configmap-reader-binding
    subjects:
      - kind: ServiceAccount
        name: reader
        namespace: d8-observer
      - kind: ServiceAccount
        name: grafana
        namespace: d8-monitoring
    namespaceRules:
      - apiGroups: [""]
        resources: [configmaps]
        resourceNames: [dex]
        verbs: [get]
